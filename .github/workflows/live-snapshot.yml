name: Snapshot live site

# Read-only: saves orvann.com's homepage and the files it loads, as a run artifact.
on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir live && cd live
          wget -q -e robots=off -p -H -D orvann.com -nH -E https://orvann.com/ https://orvann.com/ar/ || true
          for f in $(grep -rhoE '/_next/static/[^"'"'"' )]+' index.html ar/index.html 2>/dev/null | sort -u); do
            mkdir -p ".$(dirname "$f")"; curl -sS -o ".$f" "https://orvann.com$f" || true
          done
          find . -name '*[?:*"<>|]*' -delete
          tar czf ../live.tgz .
          python3 - <<'PY'
          import re, glob
          html = open('index.html', encoding='utf-8').read()
          i = html.lower().find('coming soon')
          print('=== HTML around banner (start of body to banner end)')
          b = html.find('<body')
          print(html[b:i+1500])
          print('=== ARABIC banner text')
          ar = open('ar/index.html', encoding='utf-8').read()
          j = ar.find('<body'); k = ar.lower().find('uae')
          print(ar[j:j+3000])
          seg = html[b:i+1500]
          classes = set(re.findall(r'class="([^"]+)"', seg))
          names = set(c for cl in classes for c in cl.split())
          mods = set(n.split('__')[0] for n in names if '__' in n)
          print('=== module prefixes', sorted(mods))
          for f in glob.glob('_next/static/**/*.css', recursive=True):
              css = open(f, encoding='utf-8').read()
              for m in mods:
                  for r in re.findall(r'[^{}]*' + re.escape(m) + r'[^{}]*\{[^{}]*\}', css):
                      print(r.strip())
              for kf in re.findall(r'@keyframes [^{]*\{(?:[^{}]*\{[^{}]*\})*[^{}]*\}', css):
                  if any(m.split('-module')[0].lower() in kf.lower() for m in mods): print(kf)
          print('=== JS chunks mentioning banner text')
          for f in glob.glob('_next/static/**/*.js', recursive=True):
              js = open(f, encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'(?i)coming soon|uae', js):
                  print(f, js[max(0,m.start()-1500):m.start()+800]); break
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-site
          path: live.tgz
