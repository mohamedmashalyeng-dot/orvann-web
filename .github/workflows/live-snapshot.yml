name: Snapshot live site

# Read-only: saves orvann.com's homepage and the files it loads, as a run artifact.
on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir live && cd live
          wget -q -e robots=off -p -H -D orvann.com -nH -E https://orvann.com/ https://orvann.com/ar/ || true
          for f in $(grep -rhoE '/_next/static/[^"'"'"' )]+' index.html ar/index.html 2>/dev/null | sort -u); do
            mkdir -p ".$(dirname "$f")"; curl -sS -o ".$f" "https://orvann.com$f" || true
          done
          find . -name '*[?:*"<>|]*' -delete
          tar czf ../live.tgz .
          python3 - <<'PY'
          import re, glob
          print('=== OFFSET RULES')
          for f in sorted(glob.glob('_next/static/**/*.css', recursive=True)):
              css = open(f, encoding='utf-8').read()
              for m in re.finditer(r'(@media[^{]*\{)?[^{}]*\{[^{}]*(header-offset|announce-height|header-height)[^{}]*\}', css):
                  print(f.split('/')[-1], m.group(0).strip()[:600])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-site
          path: live.tgz
