name: Snapshot live site

# Read-only: saves orvann.com's homepage and the files it loads, as a run artifact.
on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir live && cd live
          wget -q -e robots=off -p -H -D orvann.com -nH -E https://orvann.com/ https://orvann.com/ar/ || true
          for f in $(grep -rhoE '/_next/static/[^"'"'"' )]+' index.html ar/index.html 2>/dev/null | sort -u); do
            mkdir -p ".$(dirname "$f")"; curl -sS -o ".$f" "https://orvann.com$f" || true
          done
          find . -name '*[?:*"<>|]*' -delete
          tar czf ../live.tgz .
          python3 - <<'PY'
          import re, glob
          html = open('index.html', encoding='utf-8').read()
          print('=== HEAD inline scripts')
          for m in re.finditer(r'<script(?![^>]*src)[^>]*>(.*?)</script>', html, re.S):
              if 'intro' in m.group(1).lower() or 'theme' in m.group(1).lower(): print(m.group(1)[:3000])
          i = html.find('AnnouncementBar'); k = html.find('<header', i)
          print('=== ANNOUNCE HTML'); print(html[i-60:k+200])
          ar = open('ar/index.html', encoding='utf-8').read()
          i = ar.find('AnnouncementBar'); k = ar.find('<header', i)
          print('=== ANNOUNCE HTML AR'); print(ar[i-60:k+50])
          print('=== CSS')
          for f in sorted(glob.glob('_next/static/**/*.css', recursive=True)):
              css = open(f, encoding='utf-8').read()
              for m in re.finditer(r'@media[^{]*\{(?:[^{}]*\{[^{}]*\})*[^{}]*\}', css):
                  t = m.group(0)
                  if 'LaunchIntro' in t or 'AnnouncementBar' in t: print(t)
              for m in re.finditer(r'[^{}]*\{[^{}]*\}', css):
                  t = m.group(0)
                  if re.search(r'announce|intro|z-header', t, re.I) and 'module__' not in t: print(t.strip())
          print('=== JS')
          for f in glob.glob('_next/static/**/*.js', recursive=True):
              js = open(f, encoding='utf-8', errors='ignore').read()
              for key in ('data-intro', 'introSkip', 'intro-skip', 'orvann-intro', 'launch'):
                  for m in re.finditer(re.escape(key), js):
                      print('--', f, key); print(js[max(0,m.start()-1200):m.start()+1200]); break
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-site
          path: live.tgz
