name: Deploy to Hostinger

# Builds the static site and uploads out/ to Hostinger over FTP on every push to main.
# Needs repository secrets FTP_SERVER, FTP_USERNAME and FTP_PASSWORD
# (Settings → Secrets and variables → Actions). Without them the build and tests still
# run, and the upload is skipped.
#
# The upload only adds and replaces files: it never deletes anything on the server,
# so api/crm-config.php (kept on the server, not in the repository) is left alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://orvann.com' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      ORVANN_GA_ID: ${{ vars.ORVANN_GA_ID }}
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Install lftp
        if: env.HAS_FTP == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # mirror -R without --delete only adds and replaces files.
      - name: Upload to Hostinger
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html' }}
        run: |
          server="${FTP_SERVER#ftp://}"
          server="${server%/}"
          lftp -c "
            set net:max-retries 5
            set net:reconnect-interval-base 5
            set net:timeout 30
            set ftp:passive-mode on
            set ftp:ssl-allow ${{ vars.FTP_TLS || 'no' }}
            open -u \"$FTP_USERNAME\" --env-password \"$server\"
            mirror --reverse --verbose --parallel=4 --exclude-glob api/crm-config.php ./out/ \"$FTP_SERVER_DIR/\"
          "

      - name: Upload skipped
        if: env.HAS_FTP != 'true'
        run: echo "::warning::FTP secrets are not set, so the site was built and tested but not uploaded."
