name: Inspect FTP folders

# Read-only: lists folders the FTP account can see, to find where orvann.com is served from.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          server="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          server="${server#ftp://}"
          server="${server%/}"
          FTP_USERNAME="$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')"
          LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          export LFTP_PASSWORD
          lftp -c "
            set ftp:ssl-allow no
            open -u \"$FTP_USERNAME\" --env-password \"$server\"
            echo '--- quote PWD'
            quote PWD
            echo '--- ..'
            cls -la ..
            echo '--- ../..'
            cls -la ../..
            echo '--- / (depth 3, dirs only)'
            find -d 3 / | grep '/$' | head -80
          " || true
