name: Inspect FTP folders

# Read-only: lists folders the FTP account can see, to find where orvann.com is served from.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          server="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"
          server="${server#ftp://}"
          server="${server%/}"
          FTP_USERNAME="$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')"
          LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          export LFTP_PASSWORD
          lftp -c "
            set ftp:ssl-allow no
            open -u \"$FTP_USERNAME\" --env-password \"$server\"
            echo '--- domains/orvann.com'
            cls -la /domains/orvann.com/
            echo '--- domains/orvann.com/public_html'
            cls -la /domains/orvann.com/public_html/
            echo '--- dirs under domains/orvann.com (depth 3)'
            find -d 3 /domains/orvann.com/ | grep '/$' | head -60
            echo '--- .git_clones'
            find -d 2 /.git_clones/ | head -30
            echo '--- home index.html'
            cat /domains/orvann.com/public_html/.htaccess
          " || true
